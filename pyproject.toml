[project]
name = "agentic-mailing-services"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "charfx", email = "charifisaad123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tzdata>=2026.3",
]

[project.scripts]
agentic-mailing-services = "agentic_mailing_services:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
